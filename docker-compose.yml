
services:
  frontend:
    image: rjrahuljauhari/learning-cicd:latest
    container_name: cicd-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: rjrahuljauhari/learning-cicd-backend:latest
    container_name: cicd-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
